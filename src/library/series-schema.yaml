$schema: "https://json-schema.org/draft/2020-12/schema"
title: Series
type: array
items:
  type: object
  required:
    - title
    - release_year
  additionalProperties: false
  properties:
    title:
      type: string
      description: The title of the series.
    release_year:
      type: integer
      description: The year the series was originally released.
    sporadically_watched:
      type: boolean
      description: If the series has been watched irregularly or in random instances.
    rating:
      type: number
      description: A personal rating for the series.
      minimum: 0
      maximum: 5
    spoiler:
      type: boolean
      description: If the notes contain a spoiler.
    notes:
      type: string
      description: Analysis, more detailed reviews, and other free-form text associated with the series.
    seasons:
      type: array
      description: A list of watched seasons of the series.
      items:
        type: object
        required:
          - number
        additionalProperties: false
        properties:
          number:
            anyOf:
              - type: integer
              - type: string
            description: The season number, or a label for a named season.
          notes:
            type: string
            description: Notes specific to this particular season.
          watches:
            type: array
            description: A history of dates when this season was watched.
            items:
              type: object
              required:
                - start
                - finish
              additionalProperties: false
              properties:
                start:
                  anyOf:
                    - type: string
                      format: date # YYYY-MM-DD
                    - type: string
                      pattern: '^\d{4}-(0[1-9]|1[0-2])$' # YYYY-MM
                    - type: string
                      pattern: '^\d{4}$' # YYYY
                    - type: integer
                      minimum: 1000
                      maximum: 9999
                  description: The start date of the season watch through.
                finish:
                  anyOf:
                    - type: string
                      format: date # YYYY-MM-DD
                    - type: string
                      pattern: '^\d{4}-(0[1-9]|1[0-2])$' # YYYY-MM
                    - type: string
                      pattern: '^\d{4}$' # YYYY
                    - type: integer
                      minimum: 1000
                      maximum: 9999
                  description: The finish date of the season watch through.
                notes:
                  type: string
                  description: Notes specific to this particular watch through.
