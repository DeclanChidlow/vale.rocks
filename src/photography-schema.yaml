$schema: "https://json-schema.org/draft/2020-12/schema"
title: Photography
type: object
patternProperties:
  "\\.md$":
    type: object
    required:
      - image
      - description
      - alt_text
      - pub_time
    additionalProperties: false
    properties:
      image:
        type: string
        description: URL of the image file.
      unsplash_link:
        type: string
        description: Link to the Unsplash page.
      description:
        type: string
        description: Short description of the photo.
      alt_text:
        type: string
        description: Full alternative text for the image.
      pub_time:
        type: string
        format: date
        description: Publication date.
      location:
        type: string
        description: Where the photo was taken or what game it was taken in.
      camera:
        type: string
        minLength: 1
        description: Camera model used.
      focal:
        type: string
        description: Focal length of the lens.
      aperture:
        type: number
        description: Aperture value.
      shutter:
        type: string
        description: Shutter speed.
      iso:
        type: integer
        description: ISO setting.
      game:
        type: boolean
        description: If the photo is from a game.
      version:
        type: string
        description: Game version.
      platform:
        type: string
        description: The platform on which the picture was captured.
        enum:
          - Android
          - DS
          - Nintendo Switch
          - Oculus Go
          - PC
          - PlayStation Vita
          - PlayStation 3
          - Quest 2
          - Quest 3
          - Wii
          - Xbox 360
          - Xbox One
          - Xbox Series
          - iOS
      _body:
        type: string
        description: Details of the photograph.
additionalProperties: false
